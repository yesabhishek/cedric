[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cedric"
version = "2.0.2"
description = "A green-and-black CLI for generating clean Django, FastAPI, and Flask backend projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Abhishek Choudhury", email = "choudhuryabhishek76@gmail.com" }]
keywords = ["cli", "django", "fastapi", "flask", "scaffold", "backend"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.7",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/yesabhishek/cedric"
Repository = "https://github.com/yesabhishek/cedric"
Issues = "https://github.com/yesabhishek/cedric/issues"
Changelog = "https://github.com/yesabhishek/cedric/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
cedric = "cedric.cli:app"
cedric-setup = "cedric.cli:legacy_setup"

[tool.hatch.build.targets.wheel]
packages = ["cedric"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
